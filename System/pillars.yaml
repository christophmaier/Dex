# Strategic Pillars Configuration
# 
# Pillars are your main focus areas — think of them as how you carve up your role thematically.
# These are NOT time-bound (like quarterly goals). They represent ongoing areas of responsibility
# that typically stay consistent for 6-12+ months, or until your role significantly changes.
#
# PILLAR (ongoing):           GOAL (time-bound):
# "Revenue Growth"      vs    "Hit 150% quota in Q1"
# "Product Strategy"    vs    "Launch mobile app"
# "Customer Retention"  vs    "Reduce churn to <2%"
#
# Want to change your pillars? Just chat with Claude: "I need to reconfigure my strategic pillars"
# — it'll help you update how your work ladders up to new focus areas.
#
# The Work MCP uses these to categorize tasks and check balance across your work.

pillars:
  - id: job_search
    name: "Job Search"
    description: "Secure a new Product leadership role in Berlin (300+ company size)"
    keywords:
      - job
      - search
      - applications
      - interviews
      - networking
      - linkedin
      - resume
      - portfolio
      - outreach
      - recruiting
      - headhunters
      - career
      - role

  - id: ai_mastery
    name: "AI Mastery"
    description: "Learn AI tools and techniques to become 10x more focused, clear, and knowledgeable"
    keywords:
      - ai
      - learning
      - productivity
      - focus
      - clarity
      - knowledge
      - tools
      - automation
      - llm
      - claude
      - chatgpt
      - agents
      - efficiency

  - id: berlin_network
    name: "Berlin Network"
    description: "Expand professional network in Berlin and demonstrate value"
    keywords:
      - networking
      - berlin
      - events
      - meetups
      - community
      - relationships
      - value
      - reputation
      - visibility
      - thought leadership
      - speaking
      - content
      - demonstrate

  - id: build_ship
    name: "Build & Ship"
    description: "Build and ship products to stay hands-on and demonstrate capabilities"
    keywords:
      - build
      - ship
      - prototype
      - mvp
      - side project
      - demo
      - showcase
      - portfolio
      - hands-on
      - product
      - launch
      - create
      - maker

# Priority limits (how many active tasks per priority level)
priority_limits:
  P0: 3   # Critical/urgent - max 3 at a time
  P1: 5   # Important - max 5 at a time
  P2: 10  # Normal - suggested limit
